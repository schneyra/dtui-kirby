name: Deployment

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    environment: deployment

    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-dev

    - name: Cache NodeJS packages
      id: nodejs-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-nodejs-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nodejs-

    - name: Install NodeJS dependencies
      run: npm ci

    - name: Run PostCSS
      run: ./node_modules/.bin/postcss assets/css/style.css > assets/css/style.min.css

    - name: Cleanup
      run: rm -rf .github \
          .git \
          content \
          media \
          node_modules \
          tests \
          .editorconfig \
          .gitignore \
          .php-cs-fixer.cache \
          .php-cs-fixer.php \
          .stylelintrc.json \
          composer.json \
          composer.lock \
          docker-compose.yml \
          Dockerfile \
          package.json \
          package-lock.json \
          postcss.config.js \
          README.md \

    - name: Prepare .htaccess
      run: mv .htaccess.prod .htaccess

    - name: Deployment
      uses: easingthemes/ssh-deploy@main
      with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          EXCLUDE: "/content/, /media/, /site/config/config.secrets.php, /site/config/.license, /site/accounts/, /site/logs/, /site/sessions/"
